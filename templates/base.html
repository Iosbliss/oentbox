{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}oentbox{% endblock %}</title>
<meta name="description" content="{% block description %}oentbox entertainment discovery.{% endblock %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/styles.css' %}?v=4">
<link rel="manifest" href="{% static 'manifest.json' %}">
<meta name="theme-color" content="#0B0D10">
<link rel="icon" type="image/svg+xml" href="{% static 'img/icon-o.svg' %}">
{% block extra_head %}{% endblock %}
</head>
<body{% block body_attributes %}{% endblock %}>
{% block content %}{% endblock %}
<script src="{% static 'js/common.js' %}?v=2"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
